---
name: Spellcheck

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    name: Spellcheck
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up renv
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Run spell check
        run: |
          results <- spelling::spell_check_package()
          print(results)
          if (nrow(results) > 0) {
            cat("\n\nSpelling errors found. Please fix spelling errors or add words to inst/WORDLIST\n")
            stop("Spelling errors detected")
          }
        shell: Rscript {0}
